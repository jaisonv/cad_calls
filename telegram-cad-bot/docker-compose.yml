version: '3.8'

services:
  cadbot:
    build: .
    container_name: telegram-cad-bot
    restart: unless-stopped
    environment:
      # Required: Set your Telegram bot token
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # Optional: Customize these values
      - CAD_BASE_URL=${CAD_BASE_URL:-https://southmiamipdfl.policetocitizen.com}
      - CAD_AGENCY_ID=${CAD_AGENCY_ID:-386}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-5}
      - VERIFY_SSL=${VERIFY_SSL:-false}
    volumes:
      # Persist database across container restarts
      - ./data:/data
    command: >
      ./cadbot
      -db /data/cadbot.db
      -base-url ${CAD_BASE_URL:-https://southmiamipdfl.policetocitizen.com}
      -agency-id ${CAD_AGENCY_ID:-386}
      -interval ${CHECK_INTERVAL:-5}
      -verify-ssl=${VERIFY_SSL:-false}
